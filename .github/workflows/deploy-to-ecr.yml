name: Build and Push to AWS ECR

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"
    workflow_run:
        workflows: ["Auto Version Bump"]
        types:
            - completed

env:
    AWS_REGION: us-west-1
    ECR_REPOSITORY: ifc-export-service

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        # Only run if workflow_dispatch, tag push, or successful auto-version workflow
        if: |
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push' ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Get latest tag
              id: get_tag
              run: |
                  if [ "${{ github.event_name }}" = "push" ]; then
                    # For tag push events, use the pushed tag
                    tag="${GITHUB_REF#refs/tags/}"
                    echo "tag=$tag" >> $GITHUB_OUTPUT
                    echo "Using tag: $tag"
                  else
                    # For workflow_run or workflow_dispatch, get the latest tag from local repository
                    latest_tag=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
                    echo "tag=$latest_tag" >> $GITHUB_OUTPUT
                    echo "Using tag: $latest_tag"
                  fi

            - name: Checkout at tag
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ steps.get_tag.outputs.tag }}
                  submodules: recursive

            - name: Extract version from tag
              id: version
              run: |
                  # Use tag name as version (remove 'v' prefix)
                  TAG="${{ steps.get_tag.outputs.tag }}"
                  VERSION="${TAG#v}"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Service version: $VERSION from tag $TAG"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/common-ecr-github-actions-role
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
                  flavor: |
                      latest=true
                  tags: |
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
                      type=sha,prefix=sha-

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Image digest
              run: |
                  echo "Image pushed with tags:"
                  echo "${{ steps.meta.outputs.tags }}"
                  echo "Version: ${{ steps.version.outputs.version }}"
